# =============================================================================
#  Metrics update — 每天生成 github-metrics/*.svg 并提交回本仓库
# =============================================================================
#
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │ 为什么会用 gh-metrics/metrics 而不是 lowlighter/metrics（必读）          │
#  └─────────────────────────────────────────────────────────────────────────┘
#
# 上游 lowlighter/metrics 自 2023-09-12 的 v3.34 之后**再也没有发布过 tag**
#  （仓库最后一次有提交是 2026-05，但没有任何 release）。
#  所以 `lowlighter/metrics@latest` 实际解析到的永远是 2023 年那份代码。
#
#  2025-10 GitHub 从 PushEvent 的 payload 里移除了 `commits` 字段
#  （现在只剩 before / head / size / push_id），上游那份旧代码里
#  `flatMap(({payload}) => payload.commits)` 直接炸掉，症状是：
#
#    · plugin_activity  →  "Unexpected error"（占位图 480x60）
#      upstream/source/plugins/activity/index.mjs  的 PushEvent case
#    · plugin_habits    →  同样一句 "Unexpected error"（占位图 480x60）
#      upstream/source/plugins/habits/index.mjs:50 也读 payload.commits
#
#  两个坑的补充说明：
#    1. 解析发生在 filter 之前，所以改 plugin_activity_filter 救不回来，
#       只要 events 流里出现任意一个 PushEvent 就整块挂掉。
#    2. 报错信息之所以只有干巴巴一句 "Unexpected error"，是因为上游的
#       format.error() 把真正的 TypeError 塞进了 .error.instance 里，
#       而模板只打印 .error.message。
#
#  修复 PR：https://github.com/lowlighter/metrics/pull/1760 （EndBug）
#    改为用 rest.repos.compareCommitsWithBasehead({basehead: before...head})
#    去 API 取 commit，不再依赖 payload.commits。但该 PR 至今未被上游合并。
#
#  gh-metrics/metrics 是社区接手维护的分叉，已 cherry-pick 上述修复并持续更新：
#    · master 最新提交  2026-09-07  b594ca3c0c5f4312f9674afb91ca8d7619f9c77d
#    · 61 个用到的 action 输入全部存在，composite action，可直接平替
#    · 该分叉无 release tag，只能引用 @master；如需锁定版本，把下面的
#      `@master` 换成上面那串 commit SHA
#
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │ 如果这个分叉哪天也挂了 —— 自建步骤（详见根目录 SELF-HOSTING.md）          │
#  └─────────────────────────────────────────────────────────────────────────┘
#
#  1. fork https://github.com/gh-metrics/metrics 到你自己的账号
#  2. 把本文件所有 `uses: gh-metrics/metrics@master` 换成 `uses: <你的账号>/metrics@master`
#  3. 出问题时优先看 source/plugins/*/index.mjs —— 这里 90% 的故障都是
#     GitHub API 改了响应结构导致某个字段变 undefined
#  4. 本地复现排错：把 upstream 源码 clone 到本地，用 tests/ 下的 mock 跑
#  5. 最后手段：放弃 action，直接 docker run 或 node 跑源码后提交 SVG
#
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │ 迁移前的几个坑（已修掉，别再踩回去）                                     │
#  └─────────────────────────────────────────────────────────────────────────┘
#
#  · 原来同时存在 update.yml(07:21 UTC) 和 update2.yml(19:21 UTC) 两个内容
#    完全相同的 workflow，各跑 18 个 step = 每天 36 次调用，且会并发 push 同一分支。
#    已合并为单文件 + concurrency 互斥。
#
#  · README 里的 top-langs 卡片用的是 github-readme-stats.vercel.app 公共实例，
#    实测返回 HTTP 503。该项目已被作者归档（README 明确写了请改用
#    stats-organization/github-stats-extended），公共实例限额耗尽。
#    已迁至 github-stats-extended.vercel.app。
#
#  · 账号已由 Shameimaru-Ayaya 改名为 Hisou-Tenshi，卡片里的 username 同步更新。
#
#  · config_timezone 原来混用 Asia/Tokyo 和 Europe/Paris，已统一为 Asia/Tokyo。
#
# =============================================================================

name: Metrics update UTC 07:21

on:
  # 每天 07:21 UTC = 16:21 JST 跑一次
  # （cron 只认 UTC；想恢复一天两次就把这条加上 19:21 的那半句）
  schedule:
    - cron: "21 7 * * *"
  # 允许手动触发：改完配置后先来这里手动跑一次验证
  workflow_dispatch:
  # 手动 push 到 main 时也跑一次。
  # 注意：action 自己产生的提交带 "[Skip GitHub Action]" 标记，不会造成循环触发。
  push:
    branches: ["main", "master"]

# 防止 cron 与手动触发/推送同时跑，两个 job 抢着 push 同一分支会冲突
concurrency:
  group: metrics-update
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write # 生成的 SVG 需要提交回仓库
    steps:
      # -----------------------------------------------------------------------
      # 基础信息（顺带了几个小插件）
      # -----------------------------------------------------------------------
      - name: base
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/base.svg
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          config_timezone: Asia/Tokyo
          # base: "header, activity, community, repositories"
          # 此插件为文档中的 🧮 Repositories traffic
          plugin_traffic: yes
          # 此插件为文档中的 👨‍💻 Lines of code changed
          plugin_lines: yes
          # 此插件为文档中的 🙋 Introduction
          plugin_introduction: yes
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # Youtube Music - Recently listed
      # 若显示 "No music recently listened"，多半是 YOUTUBE_MUSIC_TOKENS 过期，
      # 该 token 需要定期刷新，与代码无关。
      # -----------------------------------------------------------------------
      - name: Youtube Music - Recently listed
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/youtube.music.svg
          token: NOT_NEEDED
          base: ""
          plugin_music_token: ${{ secrets.YOUTUBE_MUSIC_TOKENS }}
          plugin_music: yes
          plugin_music_mode: recent
          plugin_music_played_at: yes
          plugin_music_provider: youtube
          extras_css: |
                .media .infos,
                .infos div {
                  color: #FFA500 !important; 
                }
                svg {color:#FFC0CB !important;}
                title {color: #E25577 !important;}
                h1 {color: #E25577 !important;}
                h2 {color: #39C5BB !important;}
                h3 {color: #FFA500 !important;}
                h4 {color: #FFC0CB !important;}
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # Profile and detailed game history
      # -----------------------------------------------------------------------
      - name: Profile and detailed game history
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/steam.full.svg
          token: NOT_NEEDED
          base: ""
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam: yes
          plugin_steam_user: "76561199217066181"
          extras_css: |
                .media .infos div,
                .media .infos,
                .infos div {
                  color: #FFA500 !important; 
                }                
                .artist { color: #FFE211 !important; }
                svg {color:#FFC0CB !important;}
                title {color: #E25577 !important;}
                h1 {color: #E25577 !important;}
                h2 {color: #39C5BB !important;}
                h3 {color: #FFA500 !important;}
                h4 {color: #FFC0CB !important;}
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 📅 Isometric commit calendar
      # -----------------------------------------------------------------------
      - name: Full-year calendar
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # 不添加基础信息
          base: ""
          # 使用此插件
          plugin_isocalendar: yes
          # 设置成显示整年
          plugin_isocalendar_duration: full-year
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 📆 Commit calendar
      # -----------------------------------------------------------------------
      - name: Full history calendar
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/calendar.full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 💡 Coding habits and activity
      #
      # ⚠️ 这张图在 2025-10-16 之后就再没正常渲染过，直到迁移到分叉才修好。
      #    原因见文件头：habits 插件读 PushEvent.payload.commits，该字段已被
      #    GitHub 移除。自检方法：看生成的 SVG 高度，正常是 480x280 左右，
      #    如果变成 480x60 且只有 "Unexpected error"，就是又坏了。
      # -----------------------------------------------------------------------
      - name: Recent activity charts
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/habits.charts.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          # 默认就是 graph，这里显式写出来，避免以后默认值变动
          plugin_habits_charts_type: graph
          # 统计窗口，单位天，上限 30
          plugin_habits_days: 14
          config_timezone: Asia/Tokyo
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 💡 Coding habits and activity — Mildly interesting facts
      # 文档：https://github.com/gh-metrics/metrics/blob/master/source/plugins/habits/README.md
      #
      # 与上面 habits.charts 用同一个插件，但只输出文字结论（缩进风格、平均行长、
      # 最常写代码的时段与星期），不画图，所以是独立的一张卡。
      # 它同样依赖 events 流，所以历史上那张 charts 图挂掉时这张facts 也一样会挂——
      # 现在两者都靠 gh-metrics 分叉里对 PushEvent 的修复才恢复。
      # -----------------------------------------------------------------------
      - name: Mildly interesting facts
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/habits.facts.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          # 统计窗口，单位天，上限 30；与 habits.charts 保持一致
          plugin_habits_days: 14
          config_timezone: Asia/Tokyo
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 🈷️ Languages activity
      #
      # ⚠️ 已知数据质量问题：标题会写 "11 Languages"，但列表里通常只有 4-5 种。
      #    因为 "11" 来自各仓库 languages.edges 的去重并集（含 0 字节的语言），
      #    而 indepth 分析器统计出的 0 行/0 字节语言会被静默丢弃。
      #    这是上游行为，不是本仓库配置错误。
      # -----------------------------------------------------------------------
      - name: Indepth analysis
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/languages.indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            jupyter notebook, dockerfile, makefile
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 8
          # indepth 会 clone 仓库并用 linguist 逐文件分析，容易超时；
          # 之前是 15，语言统计不完整，放宽到 30
          plugin_languages_analysis_timeout: 30
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # ✨ Stargazers
      # -----------------------------------------------------------------------
      - name: Using chartist charts
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/stargazers.chartist.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 🌟 Recently starred repositories
      # -----------------------------------------------------------------------
      - name: Recently starred
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/stars.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 10
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 🎟️ Follow-up of issues and pull requests
      # -----------------------------------------------------------------------
      - name: Indepth analysis
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/followup.indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 🎭 Comment reactions
      # -----------------------------------------------------------------------
      - name: Comment reactions
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/reactions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 🧑‍🤝‍🧑 People
      # -----------------------------------------------------------------------
      - name: Followers
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/people.followers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_people: yes
          plugin_people_limit: 300
          plugin_people_size: 36
          plugin_people_types: followers, following
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 📓 Featured repositories（pinned 是数量，不是布尔值）
      # -----------------------------------------------------------------------
      - name: Pinned repositories
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/repositories.pinned.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 2
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 📜 Repository licenses — Licenses overview
      # 文档：https://github.com/gh-metrics/metrics/blob/master/source/plugins/licenses/README.md
      #
      # 这是本工作流里第一个（也是唯一一个）repository 模板的步骤。
      # plugin_licenses 只在 repository 模板下有对应的 partial（classic 模板里没有
      # licenses.ejs），所以必须写 template: repository。
      #
      # 「Licenses overview」对应的是 ratio 变体：
      #   plugin_licenses_legal: no   关掉「Permissions / Limitations / Conditions」那张
      #   plugin_licenses_ratio: yes  打开已使用许可证占比统计
      # 两个都开的话会在一张图里同时渲染两块内容。
      #
      # ⚠️ 安全提示：上游文档明确写了这个插件 SHOULD NOT 用于 web 实例，因为
      #    plugin_licenses_setup 会执行任意命令。我们只在自己的 Actions 里跑、
      #    不使用 setup 参数，所以是安全的；但**不要**把它加到任何公开的
      #    web 实例配置（settings.json）里。将来若启用 plugin_licenses_setup，
      #    务必确保它只对可信仓库执行。
      # -----------------------------------------------------------------------
      - name: Licenses overview
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/licenses.overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          template: repository
          repo: Hisou-Tenshi
          plugin_licenses: yes
          plugin_licenses_legal: no
          plugin_licenses_ratio: yes
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 💬 Discussions
      # 只有在仓库开启了 Discussions 且有讨论时才有内容
      # -----------------------------------------------------------------------
      - name: GitHub Discussions
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/discussions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_discussions: yes
          plugin_discussions_categories_limit: 8
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 🏆 Achievements
      #
      # ⚠️ 这张卡目前仍然是坏的（自 2025-09-30 起一直显示 "Unexpected error"），
      #    在迁移到 gh-metrics 分叉后**依然如此**——它和 habits/activity 那两个
      #    PushEvent 问题无关，是另一个独立的故障。
      #
      #    根因（读分叉源码 source/plugins/achievements/index.mjs 得出）：
      #      插件执行开头会先调用 total() 去初始化「GitHub 全站用户数 / 仓库数」，
      #      用于算成就的百分位。total() 依次尝试：
      #        1. graphql 查询 search(query:"created:>1970", type:USER/REPOSITORY)
      #        2. puppeteer 抓 github.com/search 页面
      #      两条路都失败时，最后一行是：
      #          return reject("Failed to initiate total for achievement plugin")
      #      注意 reject 的是一个**字符串**而不是 Error 对象。
      #
      #      而 format.error() 对字符串无能为力——它只认 axios error 或带 .message
      #      的对象，最终落到兜底分支返回 {error:{message:"Unexpected error"}}，
      #      模板打印 error.message 就只剩这四个字，真正的失败原因被完全吞掉了。
      #
      #    所以「Unexpected error」只是症状。要定位真正的失败点，需要在 Actions
      #    日志里搜这几行（插件自己会打 debug 日志）：
      #        metrics/compute/plugins > achievements > setup using graphql
      #        metrics/compute/plugins > achievements > setup error > ...
      #        metrics/compute/plugins > achievements > filling total from github.com/search
      #    实测 GitHub 的 REST search 接口本身是通的（search/repositories 与
      #    search/users 都返回 200），所以更可能是 GraphQL 侧或 puppeteer 侧的问题。
      #    ⚠️ 修复点在 fork 的源码里，不是本工作流的配置，改配置解决不了。
      # -----------------------------------------------------------------------
      - name: Compact display
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/achievements.compact.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_only: >-
            polyglot, stargazer, sponsor, deployer, member, maintainer, developer,
            scripter, packager, explorer, infographile, manager
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 📰 Recent activity
      #
      # ⚠️ 与 habits 同一个根因（PushEvent.payload.commits 被移除）。
      #    2026-02-26 之后一直被冻结在 "Unexpected error"。
      #    迁移到分叉后，PushEvent 的 commit 改为调用
      #    repos.compareCommitsWithBasehead 获取。
      #    自检：正常时 SVG 高度 200+，坏掉时是 480x60。
      # -----------------------------------------------------------------------
      - name: Recent activity
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          # 0 = 不限制事件时间范围
          plugin_activity_days: 0
          plugin_activity_filter: issue, pr, release, fork, review, ref/create
          config_timezone: Asia/Tokyo
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120

      # -----------------------------------------------------------------------
      # 🗨️ Stack Overflow
      # 注意 plugin_stackoverflow_user: 1 是官方示例里的占位数值，需要换成真实
      # 的 Stack Overflow 用户 ID，否则拉到的不是本人的数据。
      # -----------------------------------------------------------------------
      - name: Top answers from stackoverflow
        uses: gh-metrics/metrics@master
        with:
          filename: github-metrics/stackoverflow.svg
          token: NOT_NEEDED
          base: ""
          plugin_stackoverflow: yes
          plugin_stackoverflow_user: 1
          plugin_stackoverflow_sections: answers-top
          plugin_stackoverflow_limit: 2
          extras_css: |
                title {
                  color: #E25577;
                }
                h1 {
                  color: #E25577;
                }
                h2 {
                  color: #39C5BB;
                }
                h3 {
                  color: #FFA500;
                }
                svg {
                 color: #FFC0CB;
                }
                footer {
                 color: #FFC0CB;
                }
          retries: 3
          retries_delay: 300
          retries_output_action: 5
          retries_delay_output_action: 120
